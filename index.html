<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しん | ポートフォリオ</title>

    <style>
        /* ======================================
           全体設定
        ====================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
            line-height: 1.8;
            background-color: #f5fbff;
            color: #333;
        }

        /* ======================================
           コンテナ
        ====================================== */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ======================================
           ヘッダー
        ====================================== */
        header {
            background: linear-gradient(135deg, #87ceeb, #bfefff);
            text-align: center;
            padding: 80px 20px;
        }

        header h1 {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        header p {
            color: #ffffff;
            font-size: 1.1rem;
        }

        /* ======================================
           各セクション共通
        ====================================== */
        section {
            background: #ffffff;
            margin: 30px 0;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        section h2 {
            color: #4aa3d8;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d9f2ff;
        }

        /* ======================================
           リストデザイン
        ====================================== */
        ul {
            list-style: none;
        }

        li {
            padding: 8px 0;
        }

        li::before {
            content: "● ";
            color: #69bde8;
        }

        /* ======================================
           プログラミング経験カード
        ====================================== */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: #d9f2ff;
            color: #2d6f91;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: bold;
        }

        /* ======================================
           フッター
        ====================================== */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }

        /* ======================================
           スマホ対応
        ====================================== */
        @media (max-width: 768px) {
            header {
                padding: 60px 20px;
            }

            header h1 {
                font-size: 2.2rem;
            }

            section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダーエリア -->
    <header>
        <div class="container">
            <h1>しん</h1>
            <p>毎日ダラダラ過ごしています</p>
        </div>
    </header>

    <main class="container">

        <!-- 基本情報 -->
        <section>
            <h2>基本情報</h2>
            <p><strong>学年：</strong>3年</p>
            <p><strong>所属：</strong>拓殖大学工学部</p>
        </section>

        <!-- 自己紹介 -->
        <section>
            <h2>自己紹介</h2>
            <p>
                自然豊かな場所は気持ちがいいです。
                人が少なく、自分だけの時間を過ごすことができるところが好きです。
            </p>
        </section>

        <!-- 趣味 -->
        <section>
            <h2>趣味・好きなこと</h2>
            <ul>
                <li>寝ること</li>
                <li>音楽鑑賞</li>
                <li>自然の多いところに行くこと</li>
                <li>旅行</li>
            </ul>
        </section>

        <!-- プログラミング経験 -->
        <section>
            <h2>プログラミング経験</h2>
            <div class="skills">
                <div class="skill">Java</div>
                <div class="skill">Go</div>
                <div class="skill">HTML</div>
                <div class="skill">CSS</div>
                <div class="skill">JavaScript</div>
            </div>
        </section>

        <!-- 学びたいこと -->
        <section>
            <h2>この授業で学びたいこと</h2>
            <p>OSSの使いかたを学びたいです。</p>
        </section>

        <!-- サイトイメージ -->
        <section>
            <h2>サイトのイメージ</h2>
            <p><strong>好きな色：</strong>水色</p>
            <p><strong>雰囲気：</strong>シンプル</p>
        </section>

    </main>

    <!-- フッター -->
    <footer>
        <p>&copy; Shin Portfolio</p>
    </footer>

</body>
</html>
